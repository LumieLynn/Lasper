[package]
name = "lasper-guest-host-transport"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
lasper-guest-protocol = { path = "../guest-protocol" }
lasper-rootfs-path = { path = "../rootfs-path" }
libc = "0.2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
lasper-guest-runtime = { path = "../guest-runtime" }
tokio = { version = "1", features = ["macros", "sync", "time", "test-util"] }

[[test]]
name = "broker"
path = "tests/broker/main.rs"
harness = false
