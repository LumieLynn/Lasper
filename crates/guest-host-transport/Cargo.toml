[package]
name = "lasper-guest-host-transport"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
lasper-guest-protocol = { path = "../guest-protocol" }
libc = "0.2"
tokio = { version = "1", features = ["io-util", "net", "rt"] }

[dev-dependencies]
lasper-guest-runtime = { path = "../guest-runtime" }
tokio = { version = "1", features = ["macros", "sync", "time"] }
