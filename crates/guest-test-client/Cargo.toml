[package]
name = "lasper-guest-test-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.103"
clap = { workspace = true, features = ["derive"] }
lasper-guest-host-transport = { path = "../guest-host-transport" }
lasper-guest-protocol = { path = "../guest-protocol" }
libc = "0.2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "time"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }
