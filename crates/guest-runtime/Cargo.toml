[package]
name = "lasper-guest-runtime"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[features]
runtime-bin = []

[dependencies]
lasper-guest-protocol = { path = "../guest-protocol" }
lasper-local-accounts = { path = "../local-accounts" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "lasper-guest-runtime"
path = "src/main.rs"
test = false
bench = false
required-features = ["runtime-bin"]

[[test]]
name = "transport"
path = "tests/transport/main.rs"

[[test]]
name = "session"
path = "tests/session/main.rs"
harness = false
