name: Cleanup development releases

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

env:
  KEEP_DEVELOPMENT_RELEASES: 4

jobs:
  cleanup:
    name: remove old development releases
    runs-on: ubuntu-latest
    steps:
      - name: Remove releases beyond retention limit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t releases < <(
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -r 'add // []
                | map(select(.prerelease == true and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9a-f]+$"))))
                | sort_by(.created_at)
                | reverse
                | .[]
                | [.id, .tag_name]
                | @tsv'
          )

          if (( ${#releases[@]} <= KEEP_DEVELOPMENT_RELEASES )); then
            echo "${#releases[@]} development releases are within the retention limit"
            exit 0
          fi

          for release in "${releases[@]:KEEP_DEVELOPMENT_RELEASES}"; do
            IFS=$'\t' read -r release_id tag <<< "${release}"
            echo "Deleting ${tag} (release ${release_id})"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
          done
