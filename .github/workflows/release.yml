name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  metadata:
    name: validate release metadata
    runs-on: ubuntu-latest
    outputs:
      note: ${{ steps.release.outputs.note }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and release note
        id: release
        shell: bash
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          EXPECTED_TAG="v${VERSION}"
          NOTE="release-notes/${EXPECTED_TAG}.md"

          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}" >&2
            exit 1
          fi

          if [[ ! -s "${NOTE}" ]]; then
            echo "Required release note ${NOTE} is missing or empty" >&2
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not attached to the main branch" >&2
            exit 1
          fi

          echo "note=${NOTE}" >> "${GITHUB_OUTPUT}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  verify:
    name: verify release
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit dependencies
        run: cargo audit

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      - name: Check dependency licenses
        run: |
          cargo about generate --locked --fail about.hbs --output-file /tmp/lasper-dependency-notices.md
          cmp THIRD_PARTY_NOTICES.md /tmp/lasper-dependency-notices.md

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            zig: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            zig: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Setup zig
        if: ${{ matrix.zig }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: ${{ matrix.zig }}
        run: cargo install cargo-zigbuild

      - name: Build (glibc)
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked

      - name: Install target
        if: ${{ matrix.zig }}
        run: rustup target add ${{ matrix.target }}

      - name: Build (musl)
        if: ${{ matrix.zig }}
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package toolchain notices
        shell: bash
        run: |
          rustup component add rust-docs
          NOTICE_DIR="toolchain-notices-${{ matrix.target }}"
          mkdir "${NOTICE_DIR}"
          RUST_SYSROOT=$(rustc --print sysroot)
          cp "${RUST_SYSROOT}/share/doc/rust/COPYRIGHT-library.html" "${NOTICE_DIR}/Rust-standard-library.html"
          if [ "${{ matrix.zig }}" = "true" ]; then
            ZIG_LIB_DIR=$(zig env | python3 -c 'import json, sys; print(json.load(sys.stdin)["lib_dir"])')
            cp "${ZIG_LIB_DIR}/libc/musl/COPYRIGHT" "${NOTICE_DIR}/musl-COPYRIGHT.txt"
            cp "${ZIG_LIB_DIR}/libcxx/LICENSE.TXT" "${NOTICE_DIR}/LLVM-libcxx.txt"
            cp "${ZIG_LIB_DIR}/libcxxabi/LICENSE.TXT" "${NOTICE_DIR}/LLVM-libcxxabi.txt"
            cp "${ZIG_LIB_DIR}/libunwind/LICENSE.TXT" "${NOTICE_DIR}/LLVM-libunwind.txt"
          fi
          tar -czf "lasper-${{ matrix.target }}-toolchain-notices.tar.gz" "${NOTICE_DIR}"

      - name: Package binary
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cp "target/${{ matrix.target }}/release/lasper" "lasper-${{ matrix.target }}"
          else
            cp target/release/lasper "lasper-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lasper-${{ matrix.target }}
          path: |
            lasper-${{ matrix.target }}
            lasper-${{ matrix.target }}-toolchain-notices.tar.gz
          if-no-files-found: error

  release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: [metadata, verify, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: lasper-*
          merge-multiple: true
          path: dist

      - name: Package project and dependency licenses
        run: tar -czf dist/lasper-licenses.tar.gz LICENSE THIRD_PARTY_LICENSES.md THIRD_PARTY_NOTICES.md licenses

      - name: Generate checksums
        working-directory: dist
        run: sha256sum lasper-* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ needs.metadata.outputs.note }}
          files: dist/*
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          make_latest: ${{ needs.metadata.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
