name: Development release tag

on:
  workflow_call:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: tag development snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create development tag and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          if [[ "${BASE_VERSION}" != *-dev ]]; then
            echo "dev must use a -dev base version, got ${BASE_VERSION}" >&2
            exit 1
          fi

          VERSION="${BASE_VERSION}.${GITHUB_SHA:0:7}"
          TAG="v${VERSION}"
          EXISTING_TARGET=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk 'NR == 1 { print $1 }')
          if [[ -n "${EXISTING_TARGET}" ]]; then
            if [[ "${EXISTING_TARGET}" != "${GITHUB_SHA}" ]]; then
              echo "${TAG} already points to ${EXISTING_TARGET}, expected ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "${TAG} already points to this CI-verified commit"
          else
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "${TAG}" "${GITHUB_SHA}" --message "Lasper ${VERSION} development snapshot"
            git push origin "refs/tags/${TAG}"
          fi

          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"
