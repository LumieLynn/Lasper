name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p lasper-guest-host-transport --all-targets --locked -- -D warnings
      - run: cargo clippy -p lasper-guest-protocol --all-targets --locked -- -D warnings
      - run: cargo clippy -p lasper-guest-runtime --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked
      - run: cargo test -p lasper-guest-host-transport --all-targets --locked
      - run: cargo test -p lasper-guest-protocol --all-targets --locked
      - run: cargo test -p lasper-guest-runtime --all-targets --locked

  guest-runtime:
    name: guest runtime (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build-alias: build-guest-runtime-x86-64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
            build-alias: build-guest-runtime-aarch64
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: guest-runtime-${{ matrix.target }}

      - name: Exercise guest transport on runner architecture
        run: |
          cargo test -p lasper-guest-runtime --all-targets --locked
          cargo test -p lasper-guest-host-transport --lib --test interop --test identity --test preparation --locked

      - name: Verify worker identity across user namespaces
        shell: bash
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          cargo test -p lasper-guest-host-transport --lib child_user_namespace_maps_packet_and_proc_credentials --locked -- --ignored

      - name: Check guest runtime binary
        run: >-
          cargo clippy
          --package lasper-guest-runtime
          --profile guest-runtime
          --target ${{ matrix.target }}
          --bin lasper-guest-runtime
          --features runtime-bin
          --locked
          -- -D warnings

      - name: Build guest runtime
        run: cargo ${{ matrix.build-alias }}

      - name: Verify guest runtime
        shell: bash
        run: .github/scripts/verify-guest-runtime.sh ${{ matrix.target }} --run

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit dependencies
        run: cargo audit

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      - name: Check dependency licenses
        run: |
          cargo about generate --locked --fail about.hbs --output-file /tmp/lasper-dependency-notices.md
          cmp THIRD_PARTY_NOTICES.md /tmp/lasper-dependency-notices.md

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            zig: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            zig: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup zig
        if: ${{ matrix.zig }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: ${{ matrix.zig }}
        run: cargo install cargo-zigbuild

      - name: Build (glibc)
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked

      - name: Install target
        if: ${{ matrix.zig }}
        run: rustup target add ${{ matrix.target }}

      - name: Build (musl)
        if: ${{ matrix.zig }}
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cp "target/${{ matrix.target }}/release/lasper" "lasper-${{ matrix.target }}"
          else
            cp target/release/lasper "lasper-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lasper-${{ matrix.target }}
          path: lasper-${{ matrix.target }}
          if-no-files-found: error

  development-release:
    name: tag successful dev snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [fmt, clippy, test, guest-runtime, audit, build]
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/dev-release.yml
