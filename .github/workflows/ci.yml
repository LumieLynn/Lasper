name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify workspace and guest runtime
    uses: ./.github/workflows/checks.yml

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            zig: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            zig: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup zig
        if: ${{ matrix.zig }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: ${{ matrix.zig }}
        run: cargo install cargo-zigbuild

      - name: Build (glibc)
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked

      - name: Install target
        if: ${{ matrix.zig }}
        run: rustup target add ${{ matrix.target }}

      - name: Build (musl)
        if: ${{ matrix.zig }}
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cp "target/${{ matrix.target }}/release/lasper" "lasper-${{ matrix.target }}"
          else
            cp target/release/lasper "lasper-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lasper-${{ matrix.target }}
          path: lasper-${{ matrix.target }}
          if-no-files-found: error

  development-release:
    name: tag successful dev snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [verify, build]
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/dev-release.yml
