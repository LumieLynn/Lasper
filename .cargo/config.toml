[env]
# Zig cannot compile simdutf's AVX-512 target attributes; retain SSE/AVX2 dispatch.
# https://github.com/ziglang/zig/issues/20414
CXXFLAGS_x86_64_unknown_linux_musl = "-DSIMDUTF_IMPLEMENTATION_ICELAKE=0"

[alias]
build-guest-runtime-x86-64 = [
    "rustc",
    "--package", "lasper-guest-runtime",
    "--profile", "guest-runtime",
    "--target", "x86_64-unknown-linux-musl",
    "--bin", "lasper-guest-runtime",
    "--features", "runtime-bin",
    "--locked",
    "--",
    "-C", "link-self-contained=no",
    "-C", "linker=rust-lld",
    "-C", "linker-flavor=ld.lld",
    "-C", "relocation-model=pic",
    "-C", "link-arg=-pie",
    "-C", "link-arg=--no-dynamic-linker",
    "-C", "link-arg=-zmax-page-size=4096",
    "-C", "link-arg=-zcommon-page-size=4096",
]
build-guest-runtime-aarch64 = [
    "rustc",
    "--package", "lasper-guest-runtime",
    "--profile", "guest-runtime",
    "--target", "aarch64-unknown-linux-musl",
    "--bin", "lasper-guest-runtime",
    "--features", "runtime-bin",
    "--locked",
    "--",
    "-C", "link-self-contained=no",
    "-C", "linker=rust-lld",
    "-C", "linker-flavor=ld.lld",
    "-C", "relocation-model=pic",
    "-C", "link-arg=-pie",
    "-C", "link-arg=--no-dynamic-linker",
    # RELRO must also cover hosts using 16 or 64 KiB pages.
    "-C", "link-arg=-zmax-page-size=65536",
    "-C", "link-arg=-zcommon-page-size=65536",
]
