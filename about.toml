# Preferred license choices for dependencies of the shipped Linux builds.
accepted = [
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Apache-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false

